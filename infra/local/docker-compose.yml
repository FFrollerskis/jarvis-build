# Jarvis lokal infrastruktur - fase 1-stub.
# Fase 1 trenger ingen kjørende tjenester (ingen Postgres før fase 2, D-13/IMPLEMENTATION_PLAN).
# Filen etablerer kun det portable mønsteret: alt konfigureres via miljøvariabler,
# ingen hardkodede maskinstier, flyttbart mellom dev-PC (RTX 4070) og UGREEN-NAS (D-20).
#
# Fase 2 legger til: postgres (pgvector, pgmq). Fase 3: langfuse. Se DEPLOYMENT_STRATEGY.md.

# REMEDIERING DEL 1 (JARVIS-009/008/089, containment 2026-10-01):
#  - INGEN tjeneste publiserer en port på 0.0.0.0. Postgres (superbruker), Infisical,
#    Langfuse og API er KUN bundet til 127.0.0.1 (Tailscale Serve forwarder til
#    localhost - se docs/runbooks/D250_NAS_MIGRATION.md); browser-gateway publiserer
#    ingen port (api/worker når den via tjenestenavnet `browser-gateway:3030`).
#  - Flytende image-tagger er pinnet til tag@digest (flerarkitektur-indeks-digest,
#    slått opp mot Docker Hub/MCR 2026-10-01). Sammenlign mot det NAS-en faktisk kjører
#    (`docker compose images`) FØR `up --build` - se docs/remediation/BASELINE.md.
#  Strukturelt vakt: modules/core/test/remediation-1-containment-invariants.test.ts.

services:
  postgres:
    # pgvector-image gir Postgres 16 + vector-extension (aktiveres først i fase 4).
    # pgmq er bevisst utelatt: kø-valget er pg-boss-klasse over vanlige tabeller (D-13).
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: "${JARVIS_DB_NAME:-jarvis}"
      POSTGRES_USER: "${JARVIS_DB_ADMIN_USER:-postgres}"
      # Ingen default-passord: settes i lokal .env (git-ignorert).
      POSTGRES_PASSWORD: "${JARVIS_DB_ADMIN_PASSWORD:?sett JARVIS_DB_ADMIN_PASSWORD i .env}"
    ports:
      - "127.0.0.1:${JARVIS_DB_PORT:-5432}:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JARVIS_DB_ADMIN_USER:-postgres} -d ${JARVIS_DB_NAME:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # D-240 (funnet live av Tobias, "database infisical does not exist"-krasjløkke):
  # `postgres` sin egen `POSTGRES_DB` over oppretter KUN én database (`jarvis`) -
  # `infisical`/`langfuse` under trenger HVER SIN EGEN, separate database på
  # SAMME Postgres-instans. Denne ene-gangs-tjenesten oppretter dem idempotent
  # (se bootstrap-databases.sql sitt filhode) FØR infisical/langfuse startes -
  # trygt å kjøre på HVER oppstart, også når begge allerede finnes (f.eks. et
  # eksisterende `jarvis-pgdata`-volum fra FØR denne fiksen).
  db-bootstrap:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      PGPASSWORD: "${JARVIS_DB_ADMIN_PASSWORD}"
    volumes:
      - ./bootstrap-databases.sql:/bootstrap/bootstrap-databases.sql:ro
    command: >
      psql -h postgres -U ${JARVIS_DB_ADMIN_USER:-postgres} -d ${JARVIS_DB_NAME:-jarvis}
      -v ON_ERROR_STOP=1 -f /bootstrap/bootstrap-databases.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    # D-27: self-hosted Langfuse v2 (kun Postgres-avhengighet). Init-noekler
    # kommer fra .env (lokale dev-verdier) - aldri hardkodet her.
    image: langfuse/langfuse:2.95.11@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015
    environment:
      DATABASE_URL: "postgresql://${JARVIS_DB_ADMIN_USER:-postgres}:${JARVIS_DB_ADMIN_PASSWORD}@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://127.0.0.1:3050"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID}"
      LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID}"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL}"
      LANGFUSE_INIT_USER_NAME: "${LANGFUSE_INIT_USER_NAME}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"
    ports:
      - "127.0.0.1:3050:3000"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  infisical-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      retries: 5

  infisical:
    # D-35: self-hosted Infisical (deler Docker-Postgres via egen db 'infisical').
    image: infisical/infisical:latest-postgres@sha256:36438985877fb5ab99c76ee1a9c73611e44d8518b44a77304b5d4c05451f8c62
    environment:
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgresql://${JARVIS_DB_ADMIN_USER:-postgres}:${JARVIS_DB_ADMIN_PASSWORD}@postgres:5432/infisical"
      REDIS_URL: "redis://infisical-redis:6379"
      SITE_URL: "http://127.0.0.1:3060"
      TELEMETRY_ENABLED: "false"
      # D-346: uten disse kan Infisical ALDRI sende verifikasjons-/passord-
      # gjenopprettings-e-post (bevist host-side: "Failed to send verification
      # code" på /signup, og INGEN "Glemt passord"-gjenoppretting mulig for et
      # eksisterende admin-medlemskap hvis passordet er tapt). Tomme .env-
      # verdier (`${VAR:-}`) er trygt no-op når Tobias ikke har fylt dem inn -
      # samme "aldri en tvunget, hardkodet leverandør"-linje som resten av
      # denne filen. Aldri en hemmelighet i selve denne filen - kun .env.
      SMTP_HOST: "${INFISICAL_SMTP_HOST:-}"
      SMTP_PORT: "${INFISICAL_SMTP_PORT:-}"
      SMTP_USERNAME: "${INFISICAL_SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${INFISICAL_SMTP_PASSWORD:-}"
      SMTP_FROM_ADDRESS: "${INFISICAL_SMTP_FROM_ADDRESS:-}"
      SMTP_FROM_NAME: "${INFISICAL_SMTP_FROM_NAME:-Infisical}"
    ports:
      - "127.0.0.1:3060:8080"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      infisical-redis:
        condition: service_started
    restart: unless-stopped

  # One-shot migrasjoner (BO-07): kjører alle migrasjoner nøyaktig én gang før
  # api/worker starter. restart:no - avsluttet=suksess er startbetingelsen deres.
  # Q-21 (2026-08-15): bruker ADMIN-credentials (JARVIS_DB_ADMIN_USER/PASSWORD via
  # migrate-main.ts sin adminConfigFromEnv()) - CREATE ROLE/ALTER TABLE...ENABLE RLS/
  # CREATE EXTENSION krever admin-privilegier. Bootstrapper SAMTIDIG den ekte
  # jarvis_runtime-LOGIN-rollen api/worker skal bruke (ensureRuntimeRole) - se
  # docs/OPEN_QUESTIONS.md Q-21. .env sin JARVIS_DB_USER/PASSWORD (RUNTIME, IKKE admin)
  # flyter uendret gjennom via env_file under - koden, ikke compose, velger admin vs.
  # runtime per tjeneste.
  migrate:
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    command: ["node", "--experimental-transform-types", "apps/api/src/migrate-main.ts"]
    env_file: ["../../.env"]
    environment:
      JARVIS_DB_HOST: postgres
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: "${JARVIS_DB_NAME:-jarvis}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # Q-21: bruker RUNTIME-credentials (JARVIS_DB_USER/PASSWORD via configFromEnv()) -
    # ALDRI JARVIS_DB_ADMIN_USER/PASSWORD. main.ts fail-closer ved oppstart hvis
    # tilkoblingen skulle vise seg å være superuser/BYPASSRLS (assertRuntimeRoleSafe).
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    env_file: ["../../.env"]
    environment:
      JARVIS_API_PORT: "${JARVIS_API_PORT:-3010}"
      JARVIS_ENV: "${JARVIS_ENV:-dev}"
      JARVIS_DB_HOST: postgres
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: "${JARVIS_DB_NAME:-jarvis}"
      # Infisical er KUN selvhostet i dette oppsettet (ingen cloud-variant) -
      # container-intern adresse er derfor alltid riktig, uendret.
      INFISICAL_URL: "http://infisical:8080"
      # D-201-host-fix (2026-09-20): Langfuse KAN være enten selvhostet (denne
      # compose-filens egen `langfuse`-tjeneste) ELLER Langfuse Cloud - i
      # motsetning til Infisical har den et reelt cloud-alternativ, og `.env`
      # sin `LANGFUSE_BASE_URL` (satt til f.eks. https://cloud.langfuse.com)
      # ble tidligere ALLTID overstyrt av denne hardkodede container-interne
      # adressen, uansett hva eieren faktisk konfigurerte - sporing gikk derfor
      # stille til feil instans (Tobias sine Cloud-nøkler fikk aldri noen
      # trafikk, host-verifisert 2026-09-20). `${LANGFUSE_BASE_URL:-...}`
      # respekterer nå en eksplisitt .env-verdi, med SAMME container-interne
      # adresse som tidligere som default for det uendrede lokal-selvhostet-
      # tilfellet - ingen regresjon for eksisterende oppsett uten en satt verdi.
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-http://langfuse:3000}"
      # Fra host-miljø (aldri lagret i fil her):
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "127.0.0.1:${JARVIS_API_PORT:-3010}:${JARVIS_API_PORT:-3010}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${JARVIS_API_PORT:-3010}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # Q-21: samme RUNTIME-credentials som api (aldri admin) - worker-main.ts fail-closer
    # identisk ved oppstart hvis tilkoblingen skulle vise seg å være superuser/BYPASSRLS.
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    command: ["node", "--experimental-transform-types", "apps/api/src/worker-main.ts"]
    env_file: ["../../.env"]
    environment:
      JARVIS_DB_HOST: postgres
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: "${JARVIS_DB_NAME:-jarvis}"
      # I container er prosess-sandbox default (containeren er isolasjonsgrensen;
      # ingen Docker-socket monteres). Docker-sandbox (D-32) gjelder host-runtime.
      JARVIS_SANDBOX: "process"
      # BO-09: worker bruker AI Mesh + Langfuse/Infisical. Infisical er KUN
      # selvhostet (container-intern adresse, uendret). Langfuse: se D-201-
      # host-fix-kommentaren ved `api`-tjenesten over - SAMME `${LANGFUSE_
      # BASE_URL:-...}`-mønster, ikke en duplisert/uavhengig regel.
      INFISICAL_URL: "http://infisical:8080"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-http://langfuse:3000}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  voice-gateway:
    # D-212 (task #120): egen prosess (CLAUDE.md ufravikelig regel 5) - IKKE
    # en rute i `api`. `JARVIS_CORE_URL` peker på `api`-tjenestens
    # container-interne adresse - UTEN dette faller gatewayen tilbake til
    # sin egen default (`http://127.0.0.1:3010`), som er FEIL inne i
    # compose-nettverket.
    #
    # D-253: EGET image (voice-gateway.Dockerfile), IKKE lenger det delte
    # api.Dockerfile-imaget api/worker/migrate bruker - lokal whisper.cpp/
    # piper (bygd/hentet i imaget) trenger et glibc-baseimage + en C/C++-
    # toolchain, som ville blåst opp de tre andre, rent Node-baserte
    # tjenestene helt unødvendig. Se D-253 i DECISIONS_AND_ASSUMPTIONS.md.
    build:
      context: ../..
      dockerfile: infra/local/voice-gateway.Dockerfile
    environment:
      JARVIS_VOICE_PORT: "${JARVIS_VOICE_PORT:-3020}"
      JARVIS_CORE_URL: "http://api:${JARVIS_API_PORT:-3010}"
      # Fra host-miljø (aldri lagret i fil her). OpenAI STT/TTS er kodet og
      # wiret; Q-32 punkt 1 sin juridiske/eier-verifisering er nå gjort
      # (D-226, 2026-09-22, processor_terms_status: VERIFIED) - kun `health`-
      # space (D-23) og klient-oppgitte, ikke server-verifiserte spaces
      # (D-123) forblir strukturelt avvist - se docs/OPEN_QUESTIONS.md.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # REMEDIERING DEL 1 (JARVIS-080): rå-lyd-dump (D-279/D-280) er FJERNET fra
      # compose - `JARVIS_VOICE_DEBUG_DUMP_DIR` videresendes ikke lenger og
      # `./voice-debug-dumps` monteres ikke. Koden krever i tillegg et eksplisitt
      # samtykke-flagg (se apps/voice-gateway/src/debug-audio-dump.ts), så en
      # gammel `.env`-verdi alene aktiverer aldri lagring av rå lyd.
      # D-353 (Tobias direkte i chat: "den hører meg veldig dårlig ... kan
      # heller ikke bryte han midt i en samtale"). SAMME D-280-disiplin som
      # over: må listes HER eksplisitt, ellers når en `.env`-verdi ALDRI
      # containeren. Usatt: `main.ts` sine egne defaultverdier (0.05/700ms,
      # D-275) gjelder uendret - ingen atferdsendring uten eksplisitt
      # operatør-handling.
      JARVIS_VOICE_VAD_THRESHOLD: "${JARVIS_VOICE_VAD_THRESHOLD:-}"
      JARVIS_VOICE_VAD_HANGOVER_MS: "${JARVIS_VOICE_VAD_HANGOVER_MS:-}"
    # D-362 (Tobias direkte i chat, live NAS-funn under D-361-redeploy:
    # "failed to bind host port 0.0.0.0:3020/tcp: address already in use").
    # Root cause: `JARVIS_PUBLIC_VOICE_BASE_URL` (se .env.example) betyr
    # Tailscale Serve/Funnel ALLEREDE lytter PÅ TAILSCALE-GRENSESNITTET sin
    # egen 3020-port og reverse-proxyer inn til denne containeren - en
    # ubundet `3020:3020`-publisering (implisitt `0.0.0.0`, ALLE grensesnitt)
    # kolliderer derfor med Tailscale sin egen lytter på NØYAKTIG samme port.
    # Bundet til KUN loopback her: Tailscale Serve forwarder uansett til
    # `localhost:3020` (ALDRI den rå LAN-/WAN-adressen), så dette endrer
    # INGEN faktisk nåbarhet for Tobias sin reelle bruk - det fjerner KUN en
    # unødvendig, bredere eksponering enn det som faktisk trengs (samme
    # "lokal først, ALDRI direkte til internett uten Tailscale" prinsipp som
    # regel 9). Container-til-container-kall (ingen finnes i dag for denne
    # porten - `JARVIS_CORE_URL` over går motsatt vei, api->voice-gateway
    # finnes ikke) ville uansett brukt tjenestenavnet `voice-gateway:3020`
    # over det interne Docker-nettverket, aldri denne host-publiseringen.
    ports:
      - "127.0.0.1:${JARVIS_VOICE_PORT:-3020}:${JARVIS_VOICE_PORT:-3020}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${JARVIS_VOICE_PORT:-3020}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  browser-gateway:
    # D-339: egen prosess (CLAUDE.md ufravikelig regel 5, SAMME "egen
    # prosess"-presedens som voice-gateway) - en ekte nettleserøkt har
    # tilstand (cookies/innlogging/faner) som ikke passer inn i
    # `api`/`worker`. Ingen database, ingen credentials - `credential_ref`
    # (`JARVIS_BROWSER_GATEWAY_BASE_URL`) på `api`/`worker`-siden peker
    # bare på DENNE tjenestens container-interne adresse.
    build:
      context: ../..
      dockerfile: infra/local/browser-gateway.Dockerfile
    environment:
      JARVIS_BROWSER_GATEWAY_PORT: "${JARVIS_BROWSER_GATEWAY_PORT:-3030}"
    # REMEDIERING DEL 1 (JARVIS-008): INGEN host-publisering. Gatewayen har ingen
    # autentisering og kjører en delt Chromium-side - den skal kun nås fra api/worker
    # via det interne Docker-nettverket (`http://browser-gateway:3030`).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${JARVIS_BROWSER_GATEWAY_PORT:-3030}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  jarvis-pgdata:
