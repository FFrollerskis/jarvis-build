# Jarvis lokal infrastruktur - fase 1-stub.
# Fase 1 trenger ingen kjørende tjenester (ingen Postgres før fase 2, D-13/IMPLEMENTATION_PLAN).
# Filen etablerer kun det portable mønsteret: alt konfigureres via miljøvariabler,
# ingen hardkodede maskinstier, flyttbart mellom dev-PC (RTX 4070) og UGREEN-NAS (D-20).
#
# Fase 2 legger til: postgres (pgvector, pgmq). Fase 3: langfuse. Se DEPLOYMENT_STRATEGY.md.

services:
  postgres:
    # pgvector-image gir Postgres 16 + vector-extension (aktiveres først i fase 4).
    # pgmq er bevisst utelatt: kø-valget er pg-boss-klasse over vanlige tabeller (D-13).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${JARVIS_DB_NAME:-jarvis}"
      POSTGRES_USER: "${JARVIS_DB_ADMIN_USER:-postgres}"
      # Ingen default-passord: settes i lokal .env (git-ignorert).
      POSTGRES_PASSWORD: "${JARVIS_DB_ADMIN_PASSWORD:?sett JARVIS_DB_ADMIN_PASSWORD i .env}"
    ports:
      - "${JARVIS_DB_PORT:-5432}:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    # D-27: self-hosted Langfuse v2 (kun Postgres-avhengighet). Init-noekler
    # kommer fra .env (lokale dev-verdier) - aldri hardkodet her.
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: "postgresql://${JARVIS_DB_ADMIN_USER:-postgres}:${JARVIS_DB_ADMIN_PASSWORD}@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://127.0.0.1:3050"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID}"
      LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID}"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL}"
      LANGFUSE_INIT_USER_NAME: "${LANGFUSE_INIT_USER_NAME}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"
    ports:
      - "3050:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  infisical-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      retries: 5

  infisical:
    # D-35: self-hosted Infisical (deler Docker-Postgres via egen db 'infisical').
    image: infisical/infisical:latest-postgres
    environment:
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgresql://${JARVIS_DB_ADMIN_USER:-postgres}:${JARVIS_DB_ADMIN_PASSWORD}@postgres:5432/infisical"
      REDIS_URL: "redis://infisical-redis:6379"
      SITE_URL: "http://127.0.0.1:3060"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3060:8080"
    depends_on:
      - postgres
      - infisical-redis
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    environment:
      JARVIS_API_PORT: "${JARVIS_API_PORT:-3010}"
      JARVIS_ENV: "${JARVIS_ENV:-dev}"
    ports:
      - "${JARVIS_API_PORT:-3010}:${JARVIS_API_PORT:-3010}"
    restart: unless-stopped

volumes:
  jarvis-pgdata:
