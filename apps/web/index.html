<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<!--JARVIS_OWNER_META-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charlie · Samtale</title>
<style>
  /*
   * D-382 (Tobias direkte i chat: "bygg ui bedre ... hele dash voice og chat ser bedre ut"): samme design-tokens som
   * dashboard.html/command.html (D-239/D-361). Identitets-/grant-logikken under er UENDRET (Ed25519 via Web Crypto, D-131/D-252/D-347).
   * Nytt: meldingsbobler med lett markdown, skrive-indikator, verktøystatus-chip, hurtigvalg, og bekreftelseskort (D-382) -
   * «Godkjenn og utfør» går til grant-ruten /confirmations (serveren utfører), aldri til modellen.
   */
  :root {
    color-scheme: dark;
    --bg: #05070c; --panel: #0c121e; --panel-2: #101a2b; --border: #1c2942; --text: #e9eefb; --text-dim: #7e8bab;
    --accent: #22d3ee; --accent-strong: #67e8f9; --accent-glow: rgba(34,211,238,0.35);
    --ok: #6ee7b7; --ok-bg: #0c2a20; --warn: #fbbf24; --warn-bg: #3a2a06; --danger: #fb7185; --danger-bg: #3d1220; --info: #93c5fd;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Inter", Roboto, system-ui, sans-serif; margin:0; display:flex; flex-direction:column; height:100vh;
         background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(34,211,238,0.10), transparent 60%), var(--bg); background-attachment: fixed;
         color: var(--text); -webkit-font-smoothing: antialiased; }
  header { padding:12px 18px; background: rgba(12,18,30,0.82); backdrop-filter: blur(10px); border-bottom:1px solid #16203380;
           font-weight:600; display:flex; align-items:center; gap:10px; }
  header .dot { width:8px; height:8px; border-radius:50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent-glow); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 0 7px rgba(34,211,238,0); } 100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); } }
  header small { color: var(--text-dim); font-weight:400; margin-left:4px; font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  #log > * { max-width: 820px; width:100%; margin-left:auto; margin-right:auto; }
  .msg { display:flex; gap:10px; align-items:flex-end; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; letter-spacing:0.02em; }
  .msg.jarvis .avatar { background: radial-gradient(circle at 35% 35%, rgba(103,232,249,0.95), rgba(34,211,238,0.4) 60%, #0c121e 100%); color:#022; box-shadow: 0 0 14px -4px var(--accent-glow); }
  .msg.user .avatar { background: var(--panel-2); border:1px solid var(--border); color: var(--text-dim); }
  .bubble { padding:10px 14px; border-radius:16px; line-height:1.5; font-size:15px; max-width: min(78%, 640px); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user .bubble { background: linear-gradient(180deg, #1d4ed8, #1e40af); color:#fff; border-bottom-right-radius:4px; }
  .msg.jarvis .bubble { background: var(--panel-2); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.jarvis .bubble.error { border-color: rgba(251,113,133,0.5); background: var(--danger-bg); color:#fecdd3; }
  .bubble b { font-weight:700; } .bubble code { background: rgba(0,0,0,0.35); border:1px solid var(--border); border-radius:5px; padding:1px 5px; font-size:13px; }
  .bubble ul { margin:4px 0 2px; padding-left:18px; white-space:normal; } .bubble li { margin:2px 0; }
  .meta { color: var(--text-dim); font-size:11px; padding-left:40px; margin-top:-4px; }
  .typing { display:inline-flex; gap:4px; align-items:center; height:18px; }
  .typing i { width:6px; height:6px; border-radius:50%; background: var(--accent); opacity:0.4; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:0.2s; } .typing i:nth-child(3) { animation-delay:0.4s; }
  @keyframes blink { 0%,80%,100% { opacity:0.25; transform: translateY(0); } 40% { opacity:1; transform: translateY(-2px); } }
  .tool-chip { align-self:flex-start; margin-left:40px; font-size:12px; color: var(--accent-strong); background: rgba(34,211,238,0.08); border:1px solid rgba(34,211,238,0.25);
               border-radius:999px; padding:3px 10px; display:inline-flex; gap:6px; align-items:center; }
  .tool-chip::before { content:""; width:6px; height:6px; border-radius:50%; background: var(--accent); animation: pulse 1.6s infinite; }
  /* D-382: bekreftelseskort - handlingen utføres av serveren når Tobias trykker Godkjenn. */
  .confirm { margin-left:40px; background: var(--panel); border:1px solid rgba(251,191,36,0.45); border-left:3px solid var(--warn); border-radius: var(--radius);
             padding:12px 14px; max-width: min(78%, 640px); }
  .confirm .title { font-weight:700; font-size:13px; color: var(--warn); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
  .confirm .what { font-size:14px; margin-bottom:8px; }
  .confirm .what code { font-size:12px; }
  .confirm .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .confirm button { border:0; border-radius:9px; padding:7px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  .confirm button.approve { background: linear-gradient(180deg, var(--accent-strong), var(--accent)); color:#022; }
  .confirm button.reject { background: var(--panel-2); color: var(--text); border:1px solid var(--border); }
  .confirm button:disabled { opacity:0.5; cursor:default; }
  .confirm .result { font-size:12px; color: var(--text-dim); margin-top:8px; }
  .confirm.done { border-color: rgba(110,231,183,0.45); border-left-color: var(--ok); } .confirm.done .title { color: var(--ok); }
  .confirm.rejected { border-color: var(--border); border-left-color: var(--text-dim); opacity:0.75; } .confirm.rejected .title { color: var(--text-dim); }
  #suggestions { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 8px; max-width:852px; margin:0 auto; width:100%; }
  #suggestions button { background: var(--panel); border:1px solid var(--border); color: var(--text-dim); border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; }
  #suggestions button:hover { border-color: var(--accent); color: var(--accent-strong); }
  form#form { display:flex; gap:8px; padding:12px 16px 14px; background: rgba(12,18,30,0.82); backdrop-filter: blur(10px); border-top:1px solid #16203380; }
  form#form > * { max-width:852px; }
  #input { flex:1; background: var(--bg); color: var(--text); border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:15px; font-family:inherit;
           resize:none; min-height:44px; max-height:160px; line-height:1.4; }
  #input:focus { outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.15); }
  form#form button { background: linear-gradient(180deg, var(--accent-strong), var(--accent)); color:#022; border:0; border-radius:12px; padding:0 20px; cursor:pointer; font-weight:700;
                     box-shadow: 0 0 0 1px rgba(34,211,238,0.3), 0 4px 14px -4px var(--accent-glow); }
  form#form button:disabled { background: var(--panel-2); color: var(--text-dim); box-shadow:none; cursor:default; }
  #enroll { display:none; padding:12px 16px; background: var(--panel); border-top:1px solid var(--border); }
  #enroll p { margin:0 0 8px; color: var(--text-dim); font-size:13px; }
  #enroll code { color: var(--text); background: var(--bg); padding:2px 5px; border-radius:4px; }
  #enroll form { padding:0; background:none; border:0; display:flex; gap:8px; }
  #enroll input { flex:1; background: var(--bg); color: var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:15px; }
  #enroll button { background: var(--accent); color:#022; border:0; border-radius:8px; padding:0 18px; cursor:pointer; font-weight:700; }
  @media (max-width: 560px) { .bubble, .confirm { max-width: 88%; } #log { padding:14px 10px 6px; } }
</style>
</head>
<body>
<header><span class="dot"></span>Charlie <small>spør, be om noe, eller si «hva kan du?»</small></header>
<div id="log"></div>
<div id="suggestions">
  <button type="button" data-suggest="Hva skjer i dag?">Hva skjer i dag?</button>
  <button type="button" data-suggest="Sjekk e-posten min">Sjekk e-posten</button>
  <button type="button" data-suggest="Sjekk saldoen min">Sjekk saldoen</button>
  <button type="button" data-suggest="Hvilke tjenester og verktøy kan du bruke?">Hva kan du?</button>
</div>
<form id="form">
  <textarea id="input" placeholder="Snakk med Charlie … (Enter sender, Shift+Enter ny linje)" autocomplete="off" autofocus rows="1"></textarea>
  <button id="send">Send</button>
</form>
<div id="enroll">
  <p>Denne enheten er ikke innrullert ennå. Kjør på maskinen som eier Jarvis:
     <code>pnpm --filter @jarvis/api enroll-ticket</code> og lim inn billetten under.</p>
  <form id="enroll-form">
    <input id="enroll-ticket" placeholder="Innrullerings-billett …" autocomplete="off">
    <button>Innrullér</button>
  </form>
</div>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const suggestions = document.getElementById("suggestions");
  const enrollPanel = document.getElementById("enroll");
  const enrollForm = document.getElementById("enroll-form");
  const enrollTicket = document.getElementById("enroll-ticket");

  // Dev-identitet (fase 3): enhetsautentisering er faktisk koblet til for
  // DENNE dev-siden også (Ed25519 via Web Crypto). Fortsatt en lokal,
  // enkeltbruker dev-demo - ingen ekte multi-enhet-/multi-bruker-onboarding.
  //
  // D-131 (uavhengig arkitektkontroll av PR #79): feltene under er PÅSTANDER
  // som legges fram sammen med et enhetsbevis for /session/authorize. De gir
  // ingen tilgang i seg selv, og de sendes ALDRI til /chat - der presenteres
  // kun grant-tokenet, og serveren leser person/tenant/enhet/space/kanal ut av
  // grant-raden.
  //
  // D-252 (live NAS-migreringsfunn, Tobias direkte i chat: "dette kan ikke
  // komme hver gang" - gjentatt "Autorisering feilet: enhet ikke innrullert"):
  // `device_id` var FØR en hardkodet literal ("dev-web") DELT av ENHVER
  // nettleser som lastet denne siden - telefon, PC, en ny nettleserprofil.
  // Siden innrullering/nøkkelrotasjon er PER `device_id` (D-131), betydde
  // det at innrullering fra ÉN nettleser stille rullet nøkkelen for ALLE
  // andre, og enhver annen allerede-innrullert nettleser sluttet øyeblikkelig
  // å fungere ("enhet ikke innrullert" ved neste autoriseringsforsøk) -
  // uten at NOEN av nettleserne noensinne gjorde noe galt. `device_id` er nå
  // selv en per-nettleser, tilfeldig generert og lagret verdi (samme
  // `localStorage`-levetid som selve nøkkelen) - hver nettleser får sin EGEN
  // enhetsidentitet og kan innrulleres/leve permanent uavhengig av alle andre.
  // D-342 (host-bevist: "crypto.randomUUID is not a function" over Tailscale/
  // annen ren HTTP-tilgang) - crypto.randomUUID() krever en "secure context"
  // (HTTPS/localhost); metoden finnes rett og slett ikke i nettleseren ellers.
  // Fallback trengs KUN her - dette er en lokal enhets-ID i localStorage
  // (D-252), aldri et kryptografisk hemmelig token.
  function randomUUID() {
    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
      return crypto.randomUUID();
    }
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  function loadOrCreateDeviceId() {
    const stored = localStorage.getItem("jarvis.deviceid");
    if (stored) return stored;
    const id = "web-" + randomUUID();
    localStorage.setItem("jarvis.deviceid", id);
    return id;
  }

  // Remediering del 2 (JARVIS-065): eier-identiteten injiseres av serveren fra validert konfig (<meta name="jarvis-owner">)
  // - ALDRI hardkodet her. Den er kun en visnings-/forespørselsetikett; autoriteten kommer fra serverens grant-verifisering.
  const JARVIS_OWNER = (() => {
    const el = document.querySelector('meta[name="jarvis-owner"]');
    try { const o = JSON.parse(el ? el.content : "null"); if (o && o.person_id && o.tenant_id) return o; } catch (e) { /* faller til feil under */ }
    throw new Error("owner_not_configured");
  })();

  const identity = {
    person_id: JARVIS_OWNER.person_id, tenant_id: JARVIS_OWNER.tenant_id, device_id: loadOrCreateDeviceId(),
    memory_space: "personal", channel: "web"
  };

  /**
   * D-131 funn 1: det betrodde BÆRER-BEVISET fra /session/authorize
   * ({ grant_token, expires_at_ms, ... }), ikke en sesjons-ID. En sesjons-ID
   * er samtalekontinuitet og kan ikke dokumentere hvilken enhet som står bak
   * et kall, om nøkkelen er tilbakekalt, eller når autoriteten utløper.
   */
  let grant = null;
  /** Enhetsnøkkelen, holdt for å kunne re-autorisere når grantet utløper. */
  let deviceKey = null;

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /**
   * Lett, TRYGG markdown for Charlie sine svar: teksten HTML-escapes FØRST, deretter gjenkjennes kun **fet**, `kode` og
   * «- »-punktlister. Ingen rå HTML fra modellen når noen gang DOM-en.
   */
  function renderRich(text) {
    const esc = escapeHtml(text);
    const lines = esc.split("\n");
    let html = "";
    let inList = false;
    for (const line of lines) {
      const m = line.match(/^\s*[-•*]\s+(.*)$/);
      if (m) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + m[1] + "</li>";
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += (html && !html.endsWith("</ul>") ? "\n" : "") + line;
      }
    }
    if (inList) html += "</ul>";
    return html
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`\n]+)`/g, "<code>$1</code>");
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  /** Legger til en melding. Returnerer boble-elementet (tekst settes via .textContent / setRich). */
  function add(cls, text) {
    const row = document.createElement("div");
    row.className = "msg " + cls;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = cls === "user" ? "T" : "C";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    log.appendChild(row);
    scrollDown();
    return bubble;
  }
  function setTyping(bubble) {
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  }
  function setRich(bubble, text) {
    bubble.innerHTML = renderRich(text);
    scrollDown();
  }
  function addMeta(text) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = text;
    log.appendChild(meta);
    scrollDown();
  }
  const TOOL_LABELS = [
    [/^calendar/, "Sjekker kalenderen"], [/^email|^microsoft_outlook/, "Ser på e-posten"], [/^github/, "Sjekker GitHub"], [/^memory|search_my_memory/, "Leter i minnet"],
    [/^finance/, "Sjekker økonomien"], [/^(brave_search|tavily|exa)/, "Søker på nettet"], [/^(notion|drive|dropbox|onedrive|google_sheets)/, "Ser i dokumentene"],
    [/^(todoist|trello|jira|linear)/, "Sjekker oppgavene"], [/^(slack|discord)/, "Sjekker meldingene"], [/check_my_capabilities|^executive/, "Sjekker egne evner"]
  ];
  function toolLabel(name) {
    for (const [re, label] of TOOL_LABELS) if (re.test(name)) return label + " …";
    return "Jobber med saken …";
  }
  function showToolChip(name) {
    const chip = document.createElement("div");
    chip.className = "tool-chip";
    chip.textContent = toolLabel(name);
    log.appendChild(chip);
    scrollDown();
    return chip;
  }

  /**
   * D-382: bekreftelseskort rett i samtalen. «Godkjenn og utfør» går til grant-ruten /confirmations - SERVEREN utfører
   * handlingen (deterministisk, med eierens grant-identitet), modellen får aldri kallet tilbake. Teksten her er kun visning.
   */
  function toolHuman(tool) {
    const [id, action] = String(tool || "").split(".");
    const labels = { create: "opprette", update: "oppdatere", send: "sende", notify: "sende melding via", sync: "synkronisere", trash: "flytte til papirkurv i", close: "lukke i", reopen: "gjenåpne i", append: "legge til rad i", move: "flytte i", rename: "gi nytt navn i", reply: "svare i", assign: "tildele i", set: "endre i", add: "legge til i", comment: "kommentere i", cancel: "avbryte i", pause: "pause i", resume: "gjenoppta i" };
    const verb = Object.keys(labels).find((k) => (action || "").startsWith(k));
    return (verb ? labels[verb] + " " : "kjøre " + (action || "") + " i ") + (id || "").replace(/_/g, " ");
  }
  function addConfirmation(c) {
    const card = document.createElement("div");
    card.className = "confirm";
    card.dataset.confirmId = c.confirmation_id;
    card.innerHTML =
      '<div class="title">Venter på din godkjenning</div>' +
      '<div class="what">Charlie vil <b>' + escapeHtml(toolHuman(c.tool)) + "</b> <code>" + escapeHtml(c.tool || "") + "</code></div>" +
      '<div class="actions"><button type="button" class="approve">Godkjenn og utfør</button><button type="button" class="reject">Avvis</button></div>' +
      '<div class="result"></div>';
    log.appendChild(card);
    scrollDown();
  }
  async function decideConfirmation(card, decision) {
    const buttons = card.querySelectorAll("button");
    buttons.forEach((b) => { b.disabled = true; });
    const result = card.querySelector(".result");
    result.textContent = decision === "approve" ? "Utfører …" : "Avviser …";
    try {
      const active = await ensureGrant();
      const res = await fetch("/confirmations", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ grant_token: active.grant_token, action: "decide", parameters: { confirmation_id: card.dataset.confirmId, decision } })
      });
      const body = await res.json().catch(() => ({}));
      if (res.status === 404) { result.textContent = "Bekreftelsen er ikke lenger gyldig (utløpt eller allerede avgjort)."; card.classList.add("rejected"); return; }
      if (!res.ok && !(body && body.data && body.data.executed)) throw new Error((body && (body.reason || body.error)) || String(res.status));
      if (decision === "reject") { result.textContent = "Avvist."; card.classList.add("rejected"); card.querySelector(".title").textContent = "Avvist"; return; }
      const r = (body.data && body.data.result) || {};
      if (r.ok === false) {
        result.textContent = "Godkjent, men utførelsen ble stoppet: " + (r.reason || "ukjent årsak") + ".";
        card.classList.add("rejected");
        card.querySelector(".title").textContent = "Stoppet";
      } else {
        result.textContent = "Utført" + (r.external_id ? " · ref " + r.external_id : "") + ".";
        card.classList.add("done");
        card.querySelector(".title").textContent = "Utført";
      }
    } catch (err) {
      result.textContent = "Feil: " + err.message;
      buttons.forEach((b) => { b.disabled = false; });
    }
  }
  log.addEventListener("click", (e) => {
    const btn = e.target.closest(".confirm button");
    if (!btn) return;
    const card = btn.closest(".confirm");
    void decideConfirmation(card, btn.classList.contains("approve") ? "approve" : "reject");
  });

  function base64FromBuffer(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  /** SPKI DER → PEM, 64 tegn per linje - speiler EKSAKT DeviceKeys.publicKeyPem() i JarvisClient.swift. */
  function pemFromSpki(spkiBuffer) {
    const b64 = base64FromBuffer(spkiBuffer);
    const lines = b64.match(/.{1,64}/g) || [];
    return "-----BEGIN PUBLIC KEY-----\n" + lines.join("\n") + "\n-----END PUBLIC KEY-----\n";
  }

  /**
   * Enhetsnøkkel i localStorage (JWK, Ed25519). Rundtrippen JWK → JWK er
   * enklere enn rå PKCS8 i nettleseren, og JWK for Ed25519 bærer allerede den
   * offentlige komponenten (`x`) sammen med den private (`d`), så vi kan
   * rekonstruere en offentlig nøkkel fra kun det lagrede private JWK-et.
   */
  async function loadOrCreateDeviceKey() {
    const stored = localStorage.getItem("jarvis.devicekey");
    if (stored) {
      const jwk = JSON.parse(stored);
      const privateKey = await crypto.subtle.importKey("jwk", jwk, { name: "Ed25519" }, true, ["sign"]);
      const publicKey = await crypto.subtle.importKey(
        "jwk", { kty: "OKP", crv: "Ed25519", x: jwk.x }, { name: "Ed25519" }, true, ["verify"]
      );
      return { privateKey, publicKey };
    }
    const pair = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
    const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);
    localStorage.setItem("jarvis.devicekey", JSON.stringify(jwk));
    return { privateKey: pair.privateKey, publicKey: pair.publicKey };
  }

  /** Signerer en fersk engangs-nonce med enhetsnøkkelen. Gjenbrukt av begge stiene under. */
  async function signChallenge(privateKey, deviceId) {
    const res = await fetch("/devices/challenge", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ device_id: deviceId })
    });
    if (!res.ok) throw new Error("devices/challenge: " + res.status);
    const { challenge } = await res.json();
    const signature = base64FromBuffer(
      await crypto.subtle.sign({ name: "Ed25519" }, privateKey, new TextEncoder().encode(challenge))
    );
    return { challenge, signature };
  }

  /**
   * Beviser enheten og henter et ferskt grant. Returnerer `null` (aldri en
   * kastet feil) når enheten rett og slett ikke er innrullert ennå - da er
   * innrullering, ikke en feilmelding, det riktige neste steget.
   */
  async function authorize(privateKey) {
    const { challenge, signature } = await signChallenge(privateKey, identity.device_id);
    const res = await fetch("/session/authorize", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        channel: identity.channel, person_id: identity.person_id, tenant_id: identity.tenant_id,
        device_id: identity.device_id, memory_space: identity.memory_space,
        device_proof: { challenge, signature }
      })
    });
    const body = await res.json();
    if (res.ok && body.ok) return body.grant;
    if (body.reason === "device_proof_invalid" || body.reason === "unknown_device") return null;
    throw new Error("session/authorize: " + (body.reason || res.status));
  }

  /**
   * D-131 (arkitektkontroll av PR #79, funn 2): innrullering krever nå
   * EKSPLISITT eier-/bootstrap-autoritet. Den gamle koden her kalte
   * /devices/register med en selvoppgitt `identity` og `auth_strength:"active"`
   * - altså anonym innrullering: enhver nettverksklient som kjente de (ikke
   * hemmelige) ID-ene kunne skrive sin egen nøkkel og deretter «bevise» den.
   *
   * To lovlige veier nå. Har vi allerede en innrullert nøkkel på denne enheten,
   * autoriserer den sin EGEN rotasjon (`device_proof`). Ellers kreves en
   * engangs-billett fra en lokal eier-handling
   * (`pnpm --filter @jarvis/api enroll-ticket`).
   */
  async function enrollDevice(privateKey, publicKey, ticket) {
    const pem = pemFromSpki(await crypto.subtle.exportKey("spki", publicKey));
    const enrollment = ticket
      ? { kind: "enrollment_ticket", ticket }
      : (() => { throw new Error("enrollment_authority_required"); })();
    const res = await fetch("/devices/register", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        tenant_id: identity.tenant_id,
        person_id: identity.person_id,
        device: { device_id: identity.device_id, kind: "web", public_key_pem: pem },
        enrollment
      })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.ok) throw new Error("devices/register: " + (body.reason || res.status));
  }

  /**
   * Sørger for at vi har et GYLDIG grant akkurat nå. Et grant er kortlevd med
   * vilje (SESSION_GRANT_TTL_MS) - re-autorisering koster én signatur, og det
   * er nettopp derfor kort levetid er trygt. 30 s margin så vi ikke sender et
   * bevis som utløper mens forespørselen er underveis.
   */
  async function ensureGrant() {
    if (grant && grant.expires_at_ms - 30_000 > Date.now()) return grant;
    if (!deviceKey) deviceKey = await loadOrCreateDeviceKey();
    grant = await authorize(deviceKey.privateKey);
    if (!grant) {
      enrollPanel.style.display = "block";
      throw new Error("enhet ikke innrullert");
    }
    enrollPanel.style.display = "none";
    return grant;
  }

  const sessionReady = ensureGrant();
  sessionReady.catch((err) => {
    add("jarvis", "Autorisering feilet: " + err.message).classList.add("error");
  });

  /**
   * D-260 (apps/web/voice.html): en 44-tegns base64url-billett kopiert fra en
   * NAS-terminal til et nettleser-skjemafelt er strukturelt feilutsatt (Tobias
   * gjentatte ganger, live: "SKJØNNER INGENTING"/feilskriving). D-347: samme
   * fiks manglet her og i dashboard.html - kun voice.html fikk den. Delt logikk
   * i `submitEnrollment()` slik at `tryAutoEnrollFromUrl()` under kan gjenbruke
   * NØYAKTIG samme sti som det manuelle skjemaet, i stedet for å duplisere den.
   */
  async function submitEnrollment(ticket) {
    try {
      if (!deviceKey) deviceKey = await loadOrCreateDeviceKey();
      await enrollDevice(deviceKey.privateKey, deviceKey.publicKey, ticket);
      await ensureGrant();
      add("jarvis", "Enheten er innrullert.");
    } catch (err) {
      add("jarvis", "Innrullering feilet: " + err.message).classList.add("error");
    }
  }

  enrollForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const ticket = enrollTicket.value.trim();
    if (!ticket) return;
    enrollTicket.value = "";
    void submitEnrollment(ticket);
  });

  /**
   * D-347: leser `?enroll=<billett>` fra siden sin EGEN URL (aldri fra et
   * skjema) og fjerner den fra adresselinjen UMIDDELBART via
   * `history.replaceState()` - FØR selve innrulleringsforsøket - slik at en
   * billett (engangs per design) aldri blir stående synlig i nettleser-
   * historikken/bokmerker, og en siderefresh aldri kan forsøke å gjenbruke en
   * allerede konsumert billett. Se samme mønster i apps/web/voice.html (D-260).
   */
  function tryAutoEnrollFromUrl() {
    const ticket = new URLSearchParams(location.search).get("enroll");
    if (!ticket) return;
    history.replaceState(null, "", location.pathname + location.hash);
    add("jarvis", "Innrullerer enheten automatisk …");
    void submitEnrollment(ticket);
  }
  tryAutoEnrollFromUrl();

  // Tekstfelt: Enter sender, Shift+Enter gir ny linje; høyden følger innholdet.
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  suggestions.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-suggest]");
    if (!btn) return;
    input.value = btn.dataset.suggest;
    form.requestSubmit();
  });

  let busy = false;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    autosize();
    suggestions.style.display = "none";
    add("user", message);
    const reply = add("jarvis", "");
    setTyping(reply);
    busy = true;
    sendBtn.disabled = true;
    let active;
    try {
      // Fornyer automatisk hvis grantet er i ferd med å utløpe - se ensureGrant().
      active = await ensureGrant();
    } catch (err) {
      reply.textContent = "Autorisering feilet: " + err.message;
      reply.classList.add("error");
      busy = false; sendBtn.disabled = false;
      return;
    }
    let text = "";
    let chip = null;
    try {
      // D-131 funn 1: KUN grant-tokenet. `tenant_id`/`memory_space`/`channel`/
      // `session_id` sendes ikke lenger - serveren leser dem ut av grant-raden,
      // og /chat avviser en kropp med ukjente felter.
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json", accept: "text/event-stream" },
        body: JSON.stringify({ grant_token: active.grant_token, message })
      });
      if (!res.ok) { reply.textContent = "Feil: " + res.status + " " + await res.text(); reply.classList.add("error"); return; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop();
        for (const frame of frames) {
          const event = (frame.match(/^event: (.+)$/m) || [])[1];
          const data = JSON.parse((frame.match(/^data: (.+)$/m) || [])[1] || "{}");
          if (event === "token") { text += data.token; setRich(reply, text); }
          if (event === "tool_call") { if (chip) chip.remove(); chip = showToolChip(data.tool_name || ""); }
          if (event === "error") { reply.textContent = "Feil: " + (data.message || "ukjent feil"); reply.classList.add("error"); }
          if (event === "done") {
            if (chip) { chip.remove(); chip = null; }
            if (!text) { text = data.reply || ""; setRich(reply, text); }
            if (Array.isArray(data.confirmations)) data.confirmations.forEach(addConfirmation);
            addMeta("rute: " + data.routed + (data.task_id ? " · jobb: " + data.task_id : ""));
          }
        }
      }
    } catch (err) {
      reply.textContent = "Nettverksfeil: " + err.message;
      reply.classList.add("error");
    } finally {
      if (chip) chip.remove();
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
