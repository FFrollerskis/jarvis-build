name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Versjon leses fra packageManager-feltet i package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Remediering del 1 (JARVIS-007): backup/restore-testen kjører de ekte verktøyene
      # (pg_dump/pg_restore/psql + age) mot to ekte Postgres-klustre.
      - name: Install backup tooling (age + PostgreSQL client)
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client

      - name: Containment invariants (JARVIS-001/002/008/009/080/089)
        run: pnpm check:containment

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  windows-git-auth:
    # D-103 HOST-FIX v2 (2026-08-21, "d103-git-credential-helper-windows-repair"):
    # v1s GIT_ASKPASS-mekanisme så strukturelt korrekt ut, var fullstendig
    # testdekket på Linux (131 filer/2048 tester grønne), OG feilet likevel
    # på ekte Windows ("cannot spawn ...askpass.cmd: Permission denied") -
    # fordi INGEN test i suiten faktisk kjørte på ekte Windows-prosess-
    # oppstart-semantikk. Denne jobben lukker AKKURAT det gapet: en liten,
    # fokusert `windows-latest`-jobb som kjører de to test-filene som faktisk
    # utøver ekte `git`/OS-prosessoppstart for autentiseringsmekanismen (git
    # sin egen `git http-backend`-baserte smart-HTTP-server, EKTE credential-
    # helper-skriptkjøring) - BEVISST UTEN embedded-Postgres/full suite (som
    # ville gjort jobben treg/skjør uten å teste noe MER av selve Windows-
    # prosessoppstart-spørsmålet). At `coding.ts` faktisk kobler disse
    # primitivene riktig inn i argv/env er allerede bevist på Linux i
    # `build-test` (coding-git-auth-wiring.test.ts, krever Postgres) - denne
    # jobben beviser i stedet at PRIMITIVENE SELV faktisk fungerer når git
    # OG node faktisk kjøres av det ekte Windows-OS-et, ikke bare strukturelt
    # resonnert om.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Windows git credential-helper autentiseringsregresjon (D-103 HOST-FIX v2)
        run: pnpm exec vitest run modules/tasks/test/git-auth.test.ts modules/tasks/test/git-credential-isolation.test.ts

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `gitleaks/gitleaks-action@v2` kaller GitHub sitt REST-API for å liste PR-commits i
      # pull_request-kontekst (for å skanne kun diffen) - dette 403-er på denne repoens
      # Actions-token uansett `pull-requests: read`-tildeling over (bekreftet: PR #10,
      # 2026-08-17 - "Resource not accessible by integration" mot
      # /repos/.../pulls/10/commits, IKKE en faktisk secret-funn). Kjør derfor gitleaks-CLI-en
      # direkte mot HELE den utsjekkede historikken i stedet - identisk skannedekning, INGEN
      # GitHub-API-avhengighet, kan derfor aldri 403-e på denne måten igjen.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Gitleaks (secret-skanning av hele historikken)
        run: ./gitleaks detect --source . --no-banner -v
