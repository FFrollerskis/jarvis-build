name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Versjon leses fra packageManager-feltet i package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `gitleaks/gitleaks-action@v2` kaller GitHub sitt REST-API for å liste PR-commits i
      # pull_request-kontekst (for å skanne kun diffen) - dette 403-er på denne repoens
      # Actions-token uansett `pull-requests: read`-tildeling over (bekreftet: PR #10,
      # 2026-08-17 - "Resource not accessible by integration" mot
      # /repos/.../pulls/10/commits, IKKE en faktisk secret-funn). Kjør derfor gitleaks-CLI-en
      # direkte mot HELE den utsjekkede historikken i stedet - identisk skannedekning, INGEN
      # GitHub-API-avhengighet, kan derfor aldri 403-e på denne måten igjen.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Gitleaks (secret-skanning av hele historikken)
        run: ./gitleaks detect --source . --no-banner -v
